<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0B0E14;
            background-image: radial-gradient(circle at 50% 10%, rgba(99, 102, 241, 0.12) 0%, transparent 60%);
            width: 1080px;
            height: 1920px;
            display: flex;
            flex-direction: column;
            padding: 90px 70px 70px;
            color: #FFFFFF;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 45px;
        }
        .badge-subject {
            background: rgba(99, 102, 241, 0.15);
            border: 1.5px solid rgba(99, 102, 241, 0.35);
            color: #A5B4FC;
            padding: 14px 28px;
            border-radius: 100px;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .badge-tag {
            background: rgba(255, 255, 255, 0.06);
            color: #94A3B8;
            padding: 14px 26px;
            border-radius: 100px;
            font-size: 24px;
            font-weight: 600;
        }
        .question-box {
            background: #141923;
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 36px;
            padding: 55px 50px;
            margin-bottom: 35px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .question-box p {
            font-size: 40px;
            font-weight: 700;
            line-height: 1.55;
            color: #F8FAFC;
            letter-spacing: -0.3px;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .option-item {
            background: #141923;
            border: 1.5px solid rgba(255, 255, 255, 0.07);
            border-radius: 24px;
            padding: 22px 30px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .opt-letter {
            width: 58px;
            height: 58px;
            border-radius: 16px;
            background: linear-gradient(135deg, #4F46E5 0%, #3730A3 100%);
            color: #FFFFFF;
            font-size: 28px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 25px;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }
        .opt-text {
            font-size: 32px;
            font-weight: 600;
            color: #E2E8F0;
            line-height: 1.4;
        }
        /* İnstagram Anket Çıkartması İçin Ayrılan Temiz Boş Alan */
        .poll-zone {
            flex-grow: 1;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="badge-subject">⚖️ {{ ders_adi }}</div>
        <div class="badge-tag">HMGS & Hakimlik</div>
    </div>
    
    <div class="question-box">
        <p>{{ soru }}</p>
    </div>

    <div class="options-list">
        <div class="option-item"><div class="opt-letter">A</div><div class="opt-text">{{ secenek_a }}</div></div>
        <div class="option-item"><div class="opt-letter">B</div><div class="opt-text">{{ secenek_b }}</div></div>
        <div class="option-item"><div class="opt-letter">C</div><div class="opt-text">{{ secenek_c }}</div></div>
        <div class="option-item"><div class="opt-letter">D</div><div class="opt-text">{{ secenek_d }}</div></div>
        <div class="option-item"><div class="opt-letter">E</div><div class="opt-text">{{ secenek_e }}</div></div>
    </div>

    <!-- Anket stickerı için boş alan -->
    <div class="poll-zone"></div>
</body>
</html>
