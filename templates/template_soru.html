<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            /* Biraz daha koyu mordan beyaza geçiş */
            background: linear-gradient(to bottom, #C4B5FD 0%, #F1F5F9 25%, #FFFFFF 100%);
            width: 1080px;
            height: 1920px;
            display: flex;
            flex-direction: column;
            padding: 40px 60px; /* Üstteki boşluğu daha da azalttık (soru ve şıklar daha yukarıda) */
        }
        
        .question-card {
            background: white;
            border-radius: 32px;
            padding: 50px 50px; /* İç boşluğu biraz kıstık ki şıklar yukarı kaysın */
            box-shadow: 0 10px 40px rgba(0,0,0,0.06);
            z-index: 10;
        }

        .question-text {
            font-size: 42px;
            font-weight: 700;
            color: #1E293B;
            line-height: 1.5;
            margin-bottom: 40px; /* Boşluk azaltıldı */
        }
        
        .separator {
            text-align: center;
            margin-bottom: 25px; /* Boşluk azaltıldı */
        }
        .separator-dot {
            display: inline-block;
            width: 24px;
            height: 24px;
            background-color: #3B82F6;
            border-radius: 50%;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 16px; /* Şıklar arası boşluk azaltıldı */
        }

        .option {
            background-color: #F8FAFC;
            border: 2px solid #E2E8F0;
            border-radius: 20px;
            padding: 20px 30px; /* Şık paddingi azaltıldı */
            font-size: 34px;
            font-weight: 600;
            color: #1E293B;
            display: flex;
            align-items: center;
        }

        .option-letter {
            background-color: #E2E8F0;
            color: #475569;
            width: 64px;
            height: 64px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            margin-right: 30px;
            flex-shrink: 0;
            font-size: 30px;
        }
        
        /* Anket için ayrılan alan tamamen görünmez/boş yapıldı */
        .poll-space {
            flex-grow: 1;
        }
    </style>
</head>
<body>
    
    <div class="question-card">
        <div class="question-text">{{ soru }}</div>
        
        <div class="separator"><div class="separator-dot"></div></div>

        <div class="options">
            <div class="option"><div class="option-letter">A</div><div>{{ secenek_a }}</div></div>
            <div class="option"><div class="option-letter">B</div><div>{{ secenek_b }}</div></div>
            <div class="option"><div class="option-letter">C</div><div>{{ secenek_c }}</div></div>
            <div class="option"><div class="option-letter">D</div><div>{{ secenek_d }}</div></div>
            <div class="option"><div class="option-letter">E</div><div>{{ secenek_e }}</div></div>
        </div>
    </div>
    
    <!-- İnstagram Anket Alanı (Boşluk) -->
    <div class="poll-space"></div>
    
</body>
</html>
