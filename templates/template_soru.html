<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #F3EEE4;
            background-image: 
                linear-gradient(to right, rgba(150, 132, 102, 0.12) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(150, 132, 102, 0.12) 1px, transparent 1px);
            background-size: 108px 108px;
            width: 1080px;
            height: 1920px;
            display: flex;
            flex-direction: column;
            padding: 95px 70px 70px;
            color: #2B0F12;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 45px;
        }
        .badge-subject {
            background: #2B0F12;
            color: #FAF6EE;
            border: 1.5px solid #8C6D32;
            padding: 14px 28px;
            border-radius: 100px;
            font-size: 26px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(43, 15, 18, 0.15);
        }
        .badge-tag {
            background: rgba(140, 109, 50, 0.12);
            color: #8C6D32;
            border: 1.5px solid rgba(140, 109, 50, 0.25);
            padding: 14px 26px;
            border-radius: 100px;
            font-size: 24px;
            font-weight: 700;
        }
        .question-box {
            background: #FAF6EE;
            border: 2px solid #DED5C5;
            border-radius: 36px;
            padding: 55px 50px;
            margin-bottom: 35px;
            box-shadow: 0 15px 35px rgba(74, 28, 31, 0.08);
        }
        .question-box p {
            font-size: 40px;
            font-weight: 700;
            line-height: 1.55;
            color: #2B0F12;
            letter-spacing: -0.3px;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .option-item {
            background: #FAF6EE;
            border: 2px solid #DED5C5;
            border-radius: 24px;
            padding: 22px 30px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 12px rgba(74, 28, 31, 0.05);
        }
        .opt-letter {
            width: 58px;
            height: 58px;
            border-radius: 16px;
            background: linear-gradient(135deg, #2B0F12 0%, #4A1C1F 100%);
            color: #E5C882;
            border: 1.5px solid #8C6D32;
            font-size: 28px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 25px;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(43, 15, 18, 0.2);
        }
        .opt-text {
            font-size: 32px;
            font-weight: 600;
            color: #3B1B1E;
            line-height: 1.4;
        }
        /* İnstagram Anket Çıkartması İçin Ayrılan Temiz Boş Alan */
        .poll-zone {
            flex-grow: 1;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="badge-subject">⚖️ {{ ders_adi }}</div>
        <div class="badge-tag">HMGS & Hakimlik</div>
    </div>
    
    <div class="question-box">
        <p>{{ soru }}</p>
    </div>

    <div class="options-list">
        <div class="option-item"><div class="opt-letter">A</div><div class="opt-text">{{ secenek_a }}</div></div>
        <div class="option-item"><div class="opt-letter">B</div><div class="opt-text">{{ secenek_b }}</div></div>
        <div class="option-item"><div class="opt-letter">C</div><div class="opt-text">{{ secenek_c }}</div></div>
        <div class="option-item"><div class="opt-letter">D</div><div class="opt-text">{{ secenek_d }}</div></div>
        <div class="option-item"><div class="opt-letter">E</div><div class="opt-text">{{ secenek_e }}</div></div>
    </div>

    <div class="poll-zone"></div>
</body>
</html>
