<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #F3EEE4;
            background-image: 
                linear-gradient(to right, rgba(150, 132, 102, 0.12) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(150, 132, 102, 0.12) 1px, transparent 1px);
            background-size: 108px 108px;
            width: 1080px;
            height: 1920px;
            display: flex;
            flex-direction: column;
            padding: 90px 70px 70px;
            color: #2B0F12;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }
        .badge-subject {
            background: #2B0F12;
            color: #FAF6EE;
            border: 1.5px solid #8C6D32;
            padding: 14px 28px;
            border-radius: 100px;
            font-size: 26px;
            font-weight: 700;
        }
        .badge-tag {
            background: rgba(16, 185, 129, 0.15);
            color: #065F46;
            border: 1.5px solid #10B981;
            padding: 14px 26px;
            border-radius: 100px;
            font-size: 24px;
            font-weight: 700;
        }
        .question-box {
            background: #FAF6EE;
            border: 2px solid #DED5C5;
            border-radius: 32px;
            padding: 45px 50px;
            margin-bottom: 30px;
        }
        .question-box p {
            font-size: 34px;
            font-weight: 600;
            line-height: 1.5;
            color: #4A1C1F;
        }
        .correct-box {
            background: linear-gradient(135deg, #064E3B 0%, #065F46 100%);
            border: 2px solid #10B981;
            border-radius: 28px;
            padding: 35px 40px;
            display: flex;
            align-items: center;
            margin-bottom: 35px;
            box-shadow: 0 15px 35px rgba(6, 78, 59, 0.2);
            color: #FFFFFF;
        }
        .correct-letter {
            width: 76px;
            height: 76px;
            border-radius: 20px;
            background: #10B981;
            color: #022C22;
            font-size: 38px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 28px;
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }
        .correct-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .correct-label {
            font-size: 22px;
            font-weight: 700;
            color: #A7F3D0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .correct-text {
            font-size: 36px;
            font-weight: 700;
            color: #FFFFFF;
        }
        .explanation-box {
            background: #FAF6EE;
            border: 2px solid #DED5C5;
            border-radius: 32px;
            padding: 50px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            border-left: 10px solid #8C6D32;
        }
        .exp-header {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 28px;
            font-weight: 800;
            color: #8C6D32;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .exp-text {
            font-size: 34px;
            line-height: 1.65;
            color: #3B1B1E;
            font-weight: 500;
        }
        .footer {
            text-align: center;
            color: #7E6F61;
            font-size: 26px;
            font-weight: 600;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="badge-subject">⚖️ {{ ders_adi }}</div>
        <div class="badge-tag">✅ DOĞRU CEVAP</div>
    </div>
    
    <div class="question-box">
        <p>{{ soru }}</p>
    </div>

    <div class="correct-box">
        <div class="correct-letter">{{ dogru_cevap_harf }}</div>
        <div class="correct-info">
            <span class="correct-label">Doğru Seçenek</span>
            <span class="correct-text">{{ dogru_cevap_metin }}</span>
        </div>
    </div>

    <div class="explanation-box">
        <div class="exp-header">
            <span>💡</span>
            <span>Hukuki Değerlendirme & Gerekçe</span>
        </div>
        <p class="exp-text">{{ gerekce }}</p>
    </div>

    <div class="footer">Daha fazla soru için takipte kal @HukukLA</div>
</body>
</html>
